name: Nix CI health
description: Keep the pinned "Nix CI health" issue listing every public repo's ci-health issue, and page through ntfy for a main red past a day.

inputs:
  token:
    description: Token with issues:write on this repository; the search reads only public issues.
    default: ${{ github.token }}
  repository:
    description: owner/repo holding the aggregated issue.
    default: ${{ github.repository }}
  run-url:
    description: Link to this run, written into the issue.
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  digest:
    description: Also comment the weekly digest.
    default: "false"
  page:
    description: Page for red streaks in their paging hour.
    default: "true"
  ntfy-url:
    description: ntfy server.
    default: https://ntfy.sh
  ntfy-topic:
    description: ntfy topic to page; without one, a page is only a warning.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUTS: ${{ toJSON(inputs) }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { run } = await import(`${process.env.ACTION_PATH}/aggregate.mjs`);
          await run({ github, core, inputs: JSON.parse(process.env.INPUTS) });
